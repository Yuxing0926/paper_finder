# paper_finder configuration
#
# Matching model
# --------------
# All text is normalised before matching: lowercased, every run of
# non-alphanumeric characters collapsed into a single space. Matching is then
# done on whole tokens (so "ito" never matches "composition").
#
# A term may end with "*" for prefix matching:
#     conduc*   ->  conducting, conductive, conductivity, conductor
#     film*     ->  film, films
#
# Every entry under "must" is a *group*. Groups are ANDed together, terms
# inside a group are ORed:
#     must: [[transparent, tco], [conduc*, electrode*]]
#       -> (transparent OR tco) AND (conduc* OR electrode*)

email: 469900626@qq.com       # used for Crossref/OpenAlex polite pools

defaults:
  since: 2015                 # earliest publication year
  doc_type: journal-article   # Crossref type filter
  depth: 4000                 # max records pulled per Crossref query
  page_size: 1000             # Crossref rows per request (API max)
  oa_batch: 100               # DOIs per OpenAlex request (API max)
  min_remaining_usd: 0.02     # abort when OpenAlex budget drops below this
  cache: true                 # reuse previously enriched DOIs
  match: title                # title | title_abstract  (field used for must/pv)

channels:
  TCO:
    - query: transparent conductive oxide
      must:
        - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
        - [conduc*, electrode*]
    - query: transparent conducting oxide
      must:
        - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
        - [conduc*, electrode*]

  # TCO produced by sputtering. The two groups below keep the topic (TCO) and
  # the technique (sputter/magnetron) separate, so a paper must satisfy both.
  # Matching runs on title+abstract here: only ~4% of TCO titles say "sputter",
  # but the abstract almost always names the deposition method.
  # TCO produced specifically by *magnetron* sputtering. Other sputter variants
  # (ion-beam, reactive without a magnetron) are excluded on purpose: the
  # project's films come off a magnetron target.
  TCO_SPUTTER:
    queries:
      - query: transparent conductive oxide magnetron sputtering
        must:
          - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
          - [conduc*, electrode*]
          - [magnetron]
        match: title_abstract
        depth: 10000
      - query: transparent conducting oxide magnetron sputtering
        must:
          - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
          - [conduc*, electrode*]
          - [magnetron]
        match: title_abstract
        depth: 10000
      - query: magnetron sputtered transparent conductive oxide
        must:
          - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
          - [conduc*, electrode*]
          - [magnetron]
        match: title_abstract
        depth: 10000
      - query: magnetron sputtering transparent conducting oxide film
        must:
          - [transparent*, tco, ito, azo, gzo, fto, itazo, "indium tin oxide"]
          - [conduc*, electrode*]
          - [magnetron]
        match: title_abstract
        depth: 10000
      - query: magnetron sputtered indium tin oxide
        must:
          - ["indium tin oxide", ito, "al doped zno", azo, "fluorine doped tin oxide", fto]
          - [magnetron]
        match: title_abstract
        depth: 10000
    # Second discovery index. Crossref ranks query.title by relevance and drops
    # work whose title words differ, so a paper titled "ITO films grown by RF
    # magnetron sputtering" never surfaces for the phrase "transparent
    # conducting oxide". OpenAlex searches title+abstract server-side instead.
    # Each entry is one search clause; results are merged and deduplicated.
    openalex_queries:
      - magnetron sputtering transparent conducting oxide
      - magnetron sputtering transparent conductive oxide
      - magnetron sputtering indium tin oxide
      - magnetron sputtering aluminum doped zinc oxide
      - magnetron sputtering fluorine doped tin oxide
      - magnetron sputtering al doped zno
      - magnetron sputtering ITO film
      - magnetron sputtering TCO
      - RF magnetron sputtering transparent conductive
      - DC magnetron sputtering transparent conductive

  ITO:
    - query: indium tin oxide
      must:
        - ["indium tin oxide", ito]
        - [transparent*, conduc*, film*, layer*, electrode*, coating*, oxide*]
        - [film*, layer*, electrode*, coating*, transparent*, solar, cell, cells,
           photovolta*, window*, contact*, device*, substrate*, deposition,
           doped, doping, oxide*]

  FTO:
    - query: fluorine doped tin oxide
      must:
        - ["fluorine doped tin oxide", fto, "sno2 f", "f doped sno2"]
        - [transparent*, conduc*, film*, layer*, electrode*, coating*, oxide*]
        - [film*, layer*, electrode*, coating*, transparent*, solar, cell, cells,
           photovolta*, window*, contact*, device*, substrate*, deposition,
           doped, doping, oxide*]

  AZO:
    - query: aluminum doped zinc oxide
      must:
        - ["al doped zno", "aluminum doped zinc oxide", "aluminium doped zinc oxide",
           "al zno", azo]
        - [transparent*, conduc*, film*, layer*, electrode*, coating*, oxide*]
        - [film*, layer*, electrode*, coating*, transparent*, solar, cell, cells,
           photovolta*, window*, contact*, device*, substrate*, deposition,
           doped, doping, oxide*]

# A paper is flagged pv_related=yes when its title (and abstract, when the
# metadata has one) contains any of these terms. This never removes rows.
pv_keywords:
  - solar
  - solar cell
  - photovolta*
  - pv
  - cigs
  - perovskit*
  - heterojunction
  - opv
  - module
  - modules
  - silicon
  - cell
  - cells
  - tandem